[hotbar]
	#If we want to enhance creative hotbar
	enhance_creative_hotbar = true
	#If we want to enhance survival hotbar
	enhance_survival_hotbar = false
	#If we want to allow inventory rotation in survival
	allow_inventory_rotation_in_survival = true

[reach]
	#How far creative players can place and break blocks in single building mode.
	# Default: 60
	# Range: 1 ~ 256
	creative_reach = 32
	#How far creative players can place and break blocks with build modes.
	# Default: 64
	# Range: 1 ~ 256
	creative_building_reach = 64
	#How far survival players can place and break blocks with build modes.
	# Default: 6
	# Range: 1 ~ 256
	survival_building_reach = 6

[flight]
	#Whether to disable flight inertia
	disable_flight_inertia = true
	#Flight speed (vanilla is 0.05)
	# Default: 0.08
	# Range: 0.05 ~ 1.0
	flight_speed = 0.08

[noclip]
	#If No-Clip should be enabled or disabled by default when logging in
	noclip_enabled_by_default = true

	[building.angel_placement]
		#Distance at which Angel Placement targets an air block.
		# Default: 6
		# Range: 5 ~ 256
		distance = 6

	[building.survival]
		#Allow survival players to use Angel Placement to target air blocks at a distance.
		allow_angel_placement = false
		#Maximum number of blocks survival players can place or break in a single action.
		# Default: 2000
		# Range: 1 ~ 100000
		max_blocks_placed = 2000
		#Maximum size of a survival build-mode shape along any axis.
		# Default: 64
		# Range: 1 ~ 1000
		max_blocks_per_axis = 64
		#Maximum diameter for survival mirror and radial mirror modifiers.
		# Default: 256
		# Range: 1 ~ 1000
		max_mirror_size = 256
		#Maximum number of copies a survival array modifier can produce.
		# Default: 64
		# Range: 1 ~ 1000
		max_array_count = 64
		#Maximum offset distance for each survival array modifier axis.
		# Default: 64
		# Range: 1 ~ 1000
		max_array_offset = 64
		#Allow survival players to use build modes to break blocks.
		allow_breaking = true
		#Allow survival players to break only blocks they placed during the current session.
		only_placed_blocks = true
		#Maximum block hardness survival players can break. -1 disables the limit.
		# Default: -1.0
		# Range: -1.0 ~ 1.7976931348623157E308
		max_hardness = -1.0
		#Require survival players to have the correct tools to break blocks with build modes.
		require_tools = false
		#Consume tool durability when survival players break blocks with build modes.
		use_durability = false
		#Blocks softer than this hardness can always be broken with build modes in survival, ignoring the placed-only, hardness and tool restrictions. -1 disables it.
		# Default: 0.3
		# Range: -1.0 ~ 1.7976931348623157E308
		max_hardness_to_break_all_blocks = 0.3
		#Hunger-exhaustion multiplier for survival build-mode breaking.
		#Each broken block costs exhaustion = hardness x simulated vanilla mine ticks with the held item, scaled by this.
		#Faster tools take fewer ticks, so they deplete less hunger. 0 disables hunger from breaking.
		#4 exhaustion = 1 hunger point.
		# Default: 1.0
		# Range: 0.0 ~ 1000.0
		break_hunger_hardness_mult = 1.0
		#Extra exhaustion multiplier applied per broken block when the held item is the correct tool for that block.
		#Lower it to reduce (0 to eliminate) hunger depletion while using proper tools.
		# Default: 1.0
		# Range: 0.0 ~ 1000.0
		break_hunger_tool_mult = 1.0
		#Allow survival players to use build modes and open the build mode radial menu at all.
		#When off, build mode selection, placement and breaking are all disabled in survival.
		allow_build_modes = true
		#Allow survival players to undo and redo build mode actions.
		#When off, the undo/redo buttons are hidden in survival and the actions are rejected.
		allow_undo_redo = true

	[building.creative]
		#Maximum number of blocks creative players can place or break in a single action.
		# Default: 500000
		# Range: > 1
		max_blocks_placed = 500000
		#Maximum size of a creative build-mode shape along any axis.
		# Default: 1000
		# Range: > 1
		max_blocks_per_axis = 1000
		#Maximum diameter for creative mirror and radial mirror modifiers.
		# Default: 256
		# Range: > 1
		max_mirror_size = 256
		#Maximum number of copies a creative array modifier can produce.
		# Default: 256
		# Range: > 1
		max_array_count = 256
		#Maximum offset distance for each creative array modifier axis.
		# Default: 256
		# Range: > 1
		max_array_offset = 256
